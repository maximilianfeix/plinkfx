name: Bug
description: Something renders wrong, crashes, clicks or clips
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: sound
    attributes:
      label: Sound name or params
  - type: input
    id: env
    attributes:
      label: Browser / Node version / OS
