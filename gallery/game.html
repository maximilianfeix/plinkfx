<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>plink run · a 30-second game with plinkfx sounds</title>
    <meta name="description" content="A 30-second runner where every sound is plinkfx: jump, coins, stomps, power-ups. No audio files." />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <meta property="og:image" content="https://maximilianfeix.github.io/plinkfx/social-preview.png" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #16130f;
        color: #f2ede3;
        font: 14px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      body {
        display: grid;
        grid-template-rows: auto 1fr auto;
        min-height: 100%;
      }
      header,
      footer {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.75rem 1rem;
        color: #a39a8c;
        flex-wrap: wrap;
      }
      a {
        color: #f2ede3;
      }
      main {
        display: grid;
        place-items: center;
        padding: 0 0.5rem;
      }
      canvas {
        width: min(100%, 177.8vh - 12rem, 1280px);
        aspect-ratio: 16 / 9;
        image-rendering: pixelated;
        border: 1px solid #3a342c;
        touch-action: manipulation;
        display: block;
      }
    </style>
  </head>
  <body>
    <header>
      <a href="./">← plinkfx gallery</a>
      <span>space / tap: jump, twice for a double jump · m: mute</span>
    </header>
    <main><canvas id="c" width="640" height="360" aria-label="plink run game" tabindex="0"></canvas></main>
    <footer>
      <span>Every sound in this game is a plinkfx sound, synthesized live. The captions name each one.</span>
      <a href="https://github.com/maximilianfeix/plinkfx/blob/main/gallery/game.ts">source</a>
    </footer>
    <script type="module" src="./game.ts"></script>
  </body>
</html>
