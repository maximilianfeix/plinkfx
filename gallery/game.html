<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>plink run · a 30-second game with plinkfx sounds</title>
    <meta name="description" content="A 30-second runner where every sound is plinkfx: jump, coins, stomps, power-ups. No audio files." />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <meta property="og:image" content="https://maximilianfeix.github.io/plinkfx/social-preview.png" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #16130f;
        color: #f2ede3;
        font: 14px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      body {
        display: grid;
        grid-template-rows: auto 1fr auto;
        min-height: 100%;
      }
      header,
      footer {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.75rem 1rem;
        color: #a39a8c;
        flex-wrap: wrap;
      }
      a {
        color: #f2ede3;
        text-underline-offset: 3px;
      }
      :focus-visible {
        outline: 2px solid #ff5a26;
        outline-offset: 2px;
      }
      header {
        align-items: center;
      }
      .back {
        display: inline-flex;
        align-items: center;
        gap: 0.8rem;
        min-height: 44px;
        text-decoration: none;
      }
      .back img {
        height: 26px;
        width: auto;
        image-rendering: pixelated;
      }
      .back span {
        text-decoration: underline;
      }
      kbd {
        font: inherit;
        font-size: 0.8em;
        padding: 0.1em 0.4em;
        border: 1px solid #4d453b;
        border-bottom-width: 2px;
        color: #f2ede3;
      }
      main {
        display: grid;
        place-items: center;
        padding: 0 0.5rem;
      }
      canvas {
        width: min(100%, 177.8vh - 12rem, 1280px);
        aspect-ratio: 16 / 9;
        image-rendering: pixelated;
        border: 1px solid #3a342c;
        background: #1b1713;
        touch-action: manipulation;
        display: block;
      }
    </style>
  </head>
  <body>
    <header>
      <a class="back" href="./"><img src="lockup-dark.svg" alt="plinkfx" width="231" height="66" /><span>back to the gallery</span></a>
      <span><kbd>space</kbd> or tap: jump, twice for a double jump. <kbd>m</kbd> mute</span>
    </header>
    <main><canvas id="c" width="640" height="360" aria-label="plink run game" tabindex="0"></canvas></main>
    <footer>
      <span>Every sound in this game is a plinkfx sound, synthesized live. The captions name each one.</span>
      <a href="https://github.com/maximilianfeix/plinkfx/blob/main/gallery/game.ts">source</a>
    </footer>
    <script type="module" src="./game.ts"></script>
  </body>
</html>
